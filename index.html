<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>AboElfadl OTP Manager</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;background:#101827;color:#fff;
 font-family:Arial,sans-serif
}
.card{
 width:100%;max-width:430px;padding:25px;
 background:#1d293b;border:1px solid #34445d;
 border-radius:20px;box-shadow:0 20px 50px #0005
}
h2{text-align:center}
.subtitle{text-align:center;color:#aebbd0}
input,button{
 width:100%;padding:15px;margin-top:15px;
 border-radius:11px;font-size:16px
}
input{
 background:#111b2b;border:1px solid #46566d;
 color:white;text-align:center
}
button{
 background:#10a37f;color:white;border:0;
 font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
.stats{
 background:#111b2b;border-radius:12px;
 padding:15px;margin-top:18px;line-height:2
}
.stat{display:flex;justify-content:space-between}
#status{text-align:center;margin-top:18px;line-height:1.8}
.success{color:#4ade80}
.error{color:#fb7185}
</style>
</head>

<body>
<div class="card">

<h2>AboElfadl OTP Manager</h2>
<p class="subtitle">خدمة التحقق من رقم الهاتف</p>

<input
 id="phone"
 type="tel"
 maxlength="11"
 inputmode="numeric"
 placeholder="01XXXXXXXXX"
 autocomplete="tel"
>

<button id="sendBtn" onclick="sendRequest()">
إرسال طلب التحقق
</button>

<div class="stats">
 <div class="stat">
  <span>المحاولات المتاحة</span>
  <strong id="remaining">1</strong>
 </div>
 <div class="stat">
  <span>الانتظار</span>
  <strong id="timer">جاهز</strong>
 </div>
</div>

<div id="status"></div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwgDWKKP0EHwLNdfHP3YK5AuK91yEatC7cQdQ0HwQgZPGRjBLr88iRWPDTznf-4q28/exec";

let busy = false;
let cooldown = 0;
let timerInterval = null;

function normalizePhone(value){
 value = value.trim().replace(/[\s+()-]/g,"");

 if(/^01[0125]\d{8}$/.test(value))
  return "2" + value.substring(1);

 if(/^201[0125]\d{8}$/.test(value))
  return value;

 return null;
}

function showStatus(message,type=""){
 const el = document.getElementById("status");
 el.textContent = message;
 el.className = type;
}

function startTimer(seconds){
 clearInterval(timerInterval);

 cooldown = seconds;

 const btn = document.getElementById("sendBtn");
 const timer = document.getElementById("timer");

 btn.disabled = true;

 function update(){
  timer.textContent = cooldown + " ثانية";

  if(cooldown <= 0){
   clearInterval(timerInterval);
   timer.textContent = "جاهز";
   btn.disabled = false;
   return;
  }

  cooldown--;
 }

 update();

 timerInterval = setInterval(update,1000);
}

async function sendRequest(){

 if(busy || cooldown > 0) return;

 const phone = normalizePhone(
  document.getElementById("phone").value
 );

 const btn = document.getElementById("sendBtn");

 if(!phone){
  showStatus("أدخل رقم هاتف مصري صحيح","error");
  return;
 }

 if(!SCRIPT_URL.startsWith("https://script.google.com/")){
  showStatus("رابط Apps Script غير صحيح","error");
  return;
 }

 busy = true;
 btn.disabled = true;

 showStatus("جارٍ إرسال طلب التحقق...");

 try{

  const formData = new URLSearchParams();
  formData.append("phone",phone);

  const response = await fetch(SCRIPT_URL,{
   method:"POST",
   body:formData
  });

  const result = await response.json();

  if(result.success){

   showStatus(
    result.message || "تم قبول طلب الإرسال",
    "success"
   );

   document.getElementById("remaining").textContent = "0";

   startTimer(60);

  }else{

   showStatus(
    result.message || "تعذر تنفيذ الطلب",
    "error"
   );

   const wait = Number(result.waitSeconds || 0);

   if(wait > 0){
    startTimer(wait);
   }else{
    btn.disabled = false;
   }
  }

 }catch(error){

  showStatus(
   "تعذر الاتصال بالخادم: " + error.message,
   "error"
  );

  btn.disabled = false;

 }finally{
  busy = false;
 }
}
</script>

</body>
</html>
